name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo test -p nr-sib1 -p nr-sib1-ffi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p nr-sib1-ffi

  futuresdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - run: cargo check -p nr-sib1-futuresdr --features futuresdr --all-targets
      - run: cargo test -p nr-sib1-futuresdr --features futuresdr
      - run: cargo clippy -p nr-sib1-futuresdr --features futuresdr --all-targets -- -D warnings
